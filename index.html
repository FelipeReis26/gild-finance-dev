      THESIS: Gild is a timepiece for money — haute horlogerie, not fintech. The pay period
        is a power reserve; budgets are complications. Refuses the fintech card stack, the
        editorial ledger, and green-banking calm alike.
      OWN-WORLD: Dial black (#0E0F12) with engine-turned (guilloché) texture inside the dial
        only; champagne gold (#C9A96A) for applied numerals, remaining day ticks, arcs, and
        the primary action; chalk ink (#EDEBE4); tiny wide-tracked engraved caps labels (the
        dial-print grammar, native to this world); Cinzel for the balance and wordmark,
        Hanken Grotesk for UI. Muted sage in / warm bronze out; coral only for genuinely
        over. Radial composition for the instrument, refined rows below.
      STORY: Open → the dial shows the pay period as a power reserve — one tick per day,
        spent days faint, remaining days gold, today long and bright — with the money left
        as the applied numeral at center → subdial complications show the top budgets →
        the rows say where it went.
      FIRST VIEWPORT: Top bar (hamburger + GILD in engraved caps); period row; the DIAL
        with LEFT TO SPEND above the Cinzel gold numeral and days-left · €/day below;
        in/out pills; three chronograph subdials for the top budgets; gold Add.
      FORM: Watch Dial — IMPECCABLE'S PICK of re-roll 2 (grounded #1 of the luxury-steered
        list), chosen verbally by the user; seed cbdfe1ec.
